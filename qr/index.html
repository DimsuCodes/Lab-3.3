<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Component</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center flex-col p-4 w-">

    <!-- Card Wrapper -->
    <div class="bg-white p-4 rounded-2xl shadow-lg max-w-[280px] text-center flex flex-col items-center">
        <img class="w-full rounded-xl mb-6" src="image-qr-code.png" alt="QR code">
        <h1 class="font-bold text-slate-900 text-xl mb-3 leading-snug">
            Improve your front-end skills by building projects
        </h1>
        <p class="text-slate-500 text-sm mb-2 leading-relaxed">
            Scan the QR code to visit Frontend Mentor and take your coding skills to the next Level!
        </p>
    </div>

<div class="text-slate-500 text-sm mb-2 leading-relaxed p-5">     
    <footer class="">
        Challenge by <a class="hover:text-white" href="https://www.frontendmentor.io?ref=challenge" target="_blank" rel="noopener">Frontend Mentor</a>.
        Coded by <a class="hover:text-white" href="https://github.com/DimsuCodes"> Dimsu Codes</a>.
    </footer>
</div>

</body>
</html>
